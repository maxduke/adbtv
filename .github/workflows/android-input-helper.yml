name: Android Input Helper

on:
  pull_request:
    paths:
      - "LICENSE"
      - "Android/ADBTVInput/**"
      - "Apps/ADBTViOS/Resources/ADBTVInput.apk"
      - "Sources/ADBClientCore/ADBTVInstalledAppManager.swift"
      - "Sources/ADBClientCore/ADBTVRemoteControl.swift"
      - "scripts/verify-bundled-input-helper.sh"
      - ".github/workflows/android-input-helper.yml"
  push:
    branches:
      - main
      - protocol-spike
    paths:
      - "LICENSE"
      - "Android/ADBTVInput/**"
      - "Apps/ADBTViOS/Resources/ADBTVInput.apk"
      - "Sources/ADBClientCore/ADBTVInstalledAppManager.swift"
      - "Sources/ADBClientCore/ADBTVRemoteControl.swift"
      - "scripts/verify-bundled-input-helper.sh"
      - ".github/workflows/android-input-helper.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build And Test Input Helper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build and test helper
        run: gradle -p Android/ADBTVInput lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload source-built helper APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ADBTVInput-debug
          path: |
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk
            Android/ADBTVInput/ADBTV-SOURCE.txt
            LICENSE
          if-no-files-found: error
          retention-days: 7

      - name: Verify helper identities
        run: |
          for apk in \
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk \
            Apps/ADBTViOS/Resources/ADBTVInput.apk; do
            test "$(apkanalyzer manifest application-id "$apk")" = "com.maxduke.adbtv.helper.v3"
            test "$(apkanalyzer manifest version-code "$apk")" = "5"
          done

      - name: Verify bundled helper payload
        run: |
          scripts/verify-bundled-input-helper.sh \
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk \
            Apps/ADBTViOS/Resources/ADBTVInput.apk
