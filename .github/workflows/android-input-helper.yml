name: Android Input Helper

on:
  pull_request:
    paths:
      - "LICENSE"
      - "Android/ADBTVInput/**"
      - "Apps/ADBTViOS/Resources/ADBTVInput.apk"
      - "Sources/ADBClientCore/ADBTVInstalledAppManager.swift"
      - "Sources/ADBClientCore/ADBTVRemoteControl.swift"
      - ".github/workflows/android-input-helper.yml"
  push:
    branches:
      - main
      - protocol-spike
    paths:
      - "LICENSE"
      - "Android/ADBTVInput/**"
      - "Apps/ADBTViOS/Resources/ADBTVInput.apk"
      - "Sources/ADBClientCore/ADBTVInstalledAppManager.swift"
      - "Sources/ADBClientCore/ADBTVRemoteControl.swift"
      - ".github/workflows/android-input-helper.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build And Test Input Helper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build and test helper
        run: gradle -p Android/ADBTVInput lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload source-built helper APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ADBTVInput-debug
          path: |
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk
            Android/ADBTVInput/ADBTV-SOURCE.txt
            LICENSE
          if-no-files-found: error
          retention-days: 7

      - name: Verify helper identities
        run: |
          for apk in \
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk \
            Apps/ADBTViOS/Resources/ADBTVInput.apk; do
            test "$(apkanalyzer manifest application-id "$apk")" = "com.maxduke.adbtv.helper.v3"
            test "$(apkanalyzer manifest version-code "$apk")" = "5"
          done

      - name: Verify bundled helper payload
        run: |
          scripts/verify-bundled-input-helper.sh \
            Android/ADBTVInput/app/build/outputs/apk/debug/app-debug.apk \
            Apps/ADBTViOS/Resources/ADBTVInput.apk
