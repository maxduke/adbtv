name: iOS UI Snapshots

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshots:
    name: Capture Portrait Layouts
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select simulator
        id: simulator
        run: |
          devices="$(xcrun simctl list devices available --json)"
          iphone_udid="$(jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty' <<<"$devices")"
          ipad_udid="$(jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid // empty' <<<"$devices")"
          test -n "$iphone_udid"
          test -n "$ipad_udid"
          echo "iphone_udid=$iphone_udid" >> "$GITHUB_OUTPUT"
          echo "ipad_udid=$ipad_udid" >> "$GITHUB_OUTPUT"

      - name: Build preview app
        run: |
          xcodebuild \
            -project ADBTV.xcodeproj \
            -scheme ADBTV \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.iphone_udid }}" \
            -derivedDataPath build/ui-snapshots/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture portrait layouts
        run: |
          app="build/ui-snapshots/DerivedData/Build/Products/Debug-iphonesimulator/ADBTV.app"
          output="build/ui-snapshots/screenshots"
          mkdir -p "$output"

          capture_device() {
            udid="$1"
            device_name="$2"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$app"

            for appearance in light dark; do
              xcrun simctl ui "$udid" appearance "$appearance"

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-library
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-library-self-signed-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-about
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-about-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-repair
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-connection-repair-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-rename
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-device-rename-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-preview
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-remote-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-preview --ui-media-expanded
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-remote-media-expanded-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-preview --ui-install
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-install-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-apps
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-apps-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-apps --ui-app-details
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-app-details-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-tools
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-tools-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv

              xcrun simctl launch "$udid" com.maxduke.adbtv --ui-files
              sleep 2
              xcrun simctl io "$udid" screenshot \
                "$output/$device_name-$appearance-files-portrait.png"
              xcrun simctl terminate "$udid" com.maxduke.adbtv
            done

            xcrun simctl shutdown "$udid"
          }

          capture_device "${{ steps.simulator.outputs.iphone_udid }}" iphone
          capture_device "${{ steps.simulator.outputs.ipad_udid }}" ipad

          for screenshot in "$output"/*-portrait.png; do
            width="$(sips -g pixelWidth "$screenshot" | awk '/pixelWidth/{print $2}')"
            height="$(sips -g pixelHeight "$screenshot" | awk '/pixelHeight/{print $2}')"
            test "$height" -gt "$width"
          done

      - name: Upload layout snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ADBTV-ui-snapshots
          path: build/ui-snapshots/screenshots/*.png
          if-no-files-found: error
          retention-days: 3
