name: iOS UI Snapshots

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Screens to capture
        type: choice
        options:
          - full
          - library
          - quick-launch
          - localization
        default: full
      language:
        description: App language
        type: choice
        options:
          - en
          - zh-Hans
        default: en

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.language }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshots:
    name: Capture Portrait Layouts
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select simulator
        id: simulator
        run: |
          devices="$(xcrun simctl list devices available --json)"
          iphone_udid="$(jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty' <<<"$devices")"
          ipad_udid="$(jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid // empty' <<<"$devices")"
          test -n "$iphone_udid"
          test -n "$ipad_udid"
          echo "iphone_udid=$iphone_udid" >> "$GITHUB_OUTPUT"
          echo "ipad_udid=$ipad_udid" >> "$GITHUB_OUTPUT"

      - name: Build preview app
        run: |
          xcodebuild \
            -project ADBTV.xcodeproj \
            -scheme ADBTV \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.iphone_udid }}" \
            -derivedDataPath build/ui-snapshots/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture portrait layouts
        env:
          SNAPSHOT_SCOPE: ${{ inputs.scope }}
          SNAPSHOT_LANGUAGE: ${{ inputs.language }}
        run: |
          app="build/ui-snapshots/DerivedData/Build/Products/Debug-iphonesimulator/ADBTV.app"
          output="build/ui-snapshots/screenshots"
          mkdir -p "$output"
          if [ "$SNAPSHOT_LANGUAGE" = zh-Hans ]; then
            snapshot_locale=zh_Hans_CN
          else
            snapshot_locale=en_US
          fi

          capture() {
            udid="$1"
            filename="$2"
            shift 2
            xcrun simctl launch "$udid" com.maxduke.adbtv \
              -AppleLanguages "($SNAPSHOT_LANGUAGE)" -AppleLocale "$snapshot_locale" "$@"
            sleep 2
            xcrun simctl io "$udid" screenshot "$output/$filename-portrait.png"
            xcrun simctl terminate "$udid" com.maxduke.adbtv
          }

          capture_quick_launch() {
            udid="$1"
            prefix="$2"
            capture "$udid" "$prefix-quick-launch" --ui-preview --ui-quick-launch
            capture "$udid" "$prefix-quick-empty" --ui-preview
            capture "$udid" "$prefix-quick-manage" --ui-preview --ui-quick-launch --ui-quick-manage
            capture "$udid" "$prefix-quick-failed" --ui-preview --ui-quick-launch --ui-quick-failed
            capture "$udid" "$prefix-quick-sent" --ui-preview --ui-quick-launch --ui-quick-sent
          }

          capture_device() {
            udid="$1"
            device_name="$2"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$app"

            for appearance in light dark; do
              xcrun simctl ui "$udid" appearance "$appearance"

              for content_size in large accessibility-extra-extra-extra-large; do
                xcrun simctl ui "$udid" content_size "$content_size"
                prefix="$device_name-$appearance"
                if [ "$content_size" != large ]; then
                  prefix="$prefix-accessibility"
                fi

                if [ "$SNAPSHOT_SCOPE" = localization ]; then
                  capture "$udid" "$prefix-library-self-signed" --ui-library
                  capture "$udid" "$prefix-add-device" --ui-add-device
                  capture "$udid" "$prefix-pair-device" --ui-pair-device
                  capture "$udid" "$prefix-quick-launch" --ui-preview --ui-quick-launch
                  capture "$udid" "$prefix-quick-manage" --ui-preview --ui-quick-launch --ui-quick-manage
                  capture "$udid" "$prefix-quick-failed" --ui-preview --ui-quick-launch --ui-quick-failed
                  capture "$udid" "$prefix-install" --ui-preview --ui-install
                  capture "$udid" "$prefix-apps" --ui-apps --ui-active
                  capture "$udid" "$prefix-app-details" --ui-apps --ui-active --ui-app-details
                  capture "$udid" "$prefix-user-app-details" --ui-apps --ui-user-app-details
                  capture "$udid" "$prefix-uninstall-confirm" --ui-apps --ui-user-app-details --ui-uninstall-confirm
                  if [ "$content_size" != large ]; then
                    capture "$udid" "$prefix-clear-data-confirm" --ui-apps --ui-user-app-details --ui-clear-data-confirm
                    capture "$udid" "$prefix-disable-confirm" --ui-apps --ui-active --ui-app-details --ui-disable-confirm
                    capture "$udid" "$prefix-restore-confirm" --ui-apps --ui-active --ui-app-details --ui-restore-confirm
                  fi
                  capture "$udid" "$prefix-tools" --ui-tools
                  capture "$udid" "$prefix-files" --ui-files
                  capture "$udid" "$prefix-files-search" --ui-files --ui-files-search
                  capture "$udid" "$prefix-files-no-matches" --ui-files --ui-files-no-matches
                  capture "$udid" "$prefix-files-largest" --ui-files --ui-files-largest
                  continue
                fi

                if [ "$SNAPSHOT_SCOPE" = quick-launch ]; then
                  capture_quick_launch "$udid" "$prefix"
                  capture "$udid" "$prefix-device-rename" --ui-rename
                  capture "$udid" "$prefix-app-details" --ui-apps --ui-active --ui-app-details
                  capture "$udid" "$prefix-user-app-details" --ui-apps --ui-user-app-details
                  capture "$udid" "$prefix-uninstall-confirm" --ui-apps --ui-user-app-details --ui-uninstall-confirm
                  capture "$udid" "$prefix-files" --ui-files
                  continue
                fi

                capture "$udid" "$prefix-library-self-signed" --ui-library
                if [ "$SNAPSHOT_SCOPE" = library ]; then
                  continue
                fi
                capture "$udid" "$prefix-add-device" --ui-add-device
                capture "$udid" "$prefix-pair-device" --ui-pair-device
                capture "$udid" "$prefix-about" --ui-about
                capture "$udid" "$prefix-connection-repair" --ui-repair
                capture "$udid" "$prefix-device-rename" --ui-rename
                capture "$udid" "$prefix-remote" --ui-preview
                capture "$udid" "$prefix-remote-media-expanded" \
                  --ui-preview --ui-media-expanded
                capture "$udid" "$prefix-install" --ui-preview --ui-install
                capture "$udid" "$prefix-apps" --ui-apps --ui-active
                capture "$udid" "$prefix-app-details" \
                  --ui-apps --ui-active --ui-app-details
                capture "$udid" "$prefix-user-app-details" \
                  --ui-apps --ui-user-app-details
                capture "$udid" "$prefix-tools" --ui-tools
                capture "$udid" "$prefix-files" --ui-files
                capture_quick_launch "$udid" "$prefix"
                capture "$udid" "$prefix-uninstall-confirm" --ui-apps --ui-user-app-details --ui-uninstall-confirm

                if [ "$device_name" = iphone ]; then
                  capture "$udid" "$prefix-remote-failed" --ui-preview --ui-remote-failed
                  capture "$udid" "$prefix-apps-failed" --ui-apps --ui-apps-failed
                  capture "$udid" "$prefix-apps-empty" --ui-apps --ui-apps-empty
                  capture "$udid" "$prefix-apps-no-matches" --ui-apps --ui-apps-no-matches
                  capture "$udid" "$prefix-apps-refresh-failed" --ui-apps --ui-apps-refresh-failed
                fi
              done
            done

            xcrun simctl shutdown "$udid"
          }

          capture_device "${{ steps.simulator.outputs.iphone_udid }}" iphone
          capture_device "${{ steps.simulator.outputs.ipad_udid }}" ipad

          for screenshot in "$output"/*-portrait.png; do
            width="$(sips -g pixelWidth "$screenshot" | awk '/pixelWidth/{print $2}')"
            height="$(sips -g pixelHeight "$screenshot" | awk '/pixelHeight/{print $2}')"
            test "$height" -gt "$width"
          done

      - name: Upload layout snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ADBTV-ui-snapshots
          path: build/ui-snapshots/screenshots/*.png
          if-no-files-found: error
          retention-days: 3
