name: Swift Package CI

on:
  pull_request:
  push:
    branches:
      - main
      - protocol-spike

jobs:
  test:
    name: SwiftPM Tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test
